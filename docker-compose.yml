version: '3.8'

services:
  api:
    build:
      context: ./recipe_api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_PATH=/app/data/recipes.db
      - ADMIN_USERNAMES=sawyer,michaela,admin,sawman2224
    volumes:
      - recipe_data:/app/data
    networks:
      - recipe_net

  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-5050}:80"
    depends_on:
      - api
    networks:
      - recipe_net

volumes:
  recipe_data:

networks:
  recipe_net:
