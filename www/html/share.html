<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Recipe &bull; Virtual Recipe Box</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Playfair+Display:wght@700&family=Caveat:wght@600&display=swap" rel="stylesheet">
    <script src="theme.js"></script>
    <script src="auth.js"></script>
    <style>
        :root {
            --primary-pink: #FF6B81;
            --light-pink: #FFE8EE;
            --accent-pink: #F7CAC9;
            --text-color: #333333;
            --background-color: #FFFFFF;
            --card-background: #FDFDFD;
            --border-color: #E0E0E0;
            --button-hover: #E85B70;
            --floral-pattern: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.1"><circle cx="20" cy="20" r="5" fill="%23fcc" /><circle cx="80" cy="80" r="5" fill="%23fcc" /><circle cx="20" cy="80" r="5" fill="%23fcc" /><circle cx="80" cy="20" r="5" fill="%23fcc" /></svg>');
        }

        body.dark-mode {
            --primary-pink: #FE9BA3;
            --light-pink: #29517A;
            --accent-pink: #5C4B5F;
            --text-color: #F0F0F0;
            --background-color: #172D44;
            --card-background: #203F5F;
            --border-color: #55445B;
            --button-hover: #D04A5D;
            --floral-pattern: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.05"><circle cx="20" cy="20" r="5" fill="%234A3C4D" /><circle cx="80" cy="80" r="5" fill="%234A3C4D" /><circle cx="20" cy="80" r="5" fill="%234A3C4D" /><circle cx="80" cy="20" r="5" fill="%234A3C4D" /></svg>');
        }

        body {
            font-family: 'Open Sans', 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
            background-image: var(--floral-pattern);
            background-repeat: repeat;
            background-size: 80px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--primary-pink);
            color: white;
            padding: 1.1em 0;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
        }

        header h1 {
            color: white;
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-size: 1.7em;
        }

        .header-nav-links {
            margin-top: 6px;
            font-size: 0.9em;
        }

        .header-nav-links a {
            color: white;
            text-decoration: underline;
            margin: 0 10px;
            opacity: 0.9;
        }

        .header-nav-links a:hover {
            opacity: 1;
        }

        .theme-switch-wrapper {
            position: absolute;
            top: 15px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-size: 0.85em;
        }

        .theme-switch {
            display: inline-block;
            height: 22px;
            position: relative;
            width: 44px;
        }

        .theme-switch input {
            display: none;
        }

        .slider {
            background-color: #ccc;
            bottom: 0;
            cursor: pointer;
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            background-color: #fff;
            bottom: 3px;
            content: "";
            height: 16px;
            left: 3px;
            position: absolute;
            transition: .4s;
            width: 16px;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-pink);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        main {
            flex: 1;
            max-width: 860px;
            margin: 30px auto;
            padding: 0 15px;
            width: 100%;
            box-sizing: border-box;
        }

        .recipe-share-card {
            background: var(--card-background);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            position: relative;
        }

        .recipe-hero {
            border-bottom: 2px solid var(--light-pink);
            padding-bottom: 24px;
            margin-bottom: 28px;
        }

        .recipe-badges {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .badge-category {
            background: var(--primary-pink);
            color: white;
            font-size: 0.78em;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-author {
            background: var(--light-pink);
            color: var(--primary-pink);
            font-size: 0.85em;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 14px;
        }

        body.dark-mode .badge-author {
            color: white;
        }

        .recipe-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.3em;
            color: var(--primary-pink);
            margin: 0 0 16px 0;
            line-height: 1.2;
        }

        .recipe-meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            background: var(--light-pink);
            padding: 16px 20px;
            border-radius: 14px;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
        }

        .meta-label {
            font-size: 0.78em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            opacity: 0.7;
            margin-bottom: 2px;
        }

        .meta-val {
            font-weight: 700;
            font-size: 1.05em;
            color: var(--primary-pink);
        }

        body.dark-mode .meta-val {
            color: white;
        }

        .action-toolbar {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 10px 20px;
            border-radius: 24px;
            font-weight: 700;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
            text-decoration: none;
        }

        .btn-clone {
            background: var(--primary-pink);
            color: white;
            box-shadow: 0 4px 12px rgba(255, 107, 129, 0.3);
        }

        .btn-clone:hover {
            background: var(--button-hover);
            transform: translateY(-1px);
        }

        .btn-clone.saved {
            background: #27ae60;
        }

        .btn-cook-mode {
            background: transparent;
            border: 2px solid var(--primary-pink);
            color: var(--primary-pink);
        }

        .btn-cook-mode:hover {
            background: var(--primary-pink);
            color: white;
        }

        .btn-copy-link {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            opacity: 0.85;
        }

        .btn-copy-link:hover {
            opacity: 1;
            border-color: var(--primary-pink);
            color: var(--primary-pink);
        }

        /* Recipe Content Sections */
        .recipe-content-grid {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 35px;
        }

        @media (max-width: 720px) {
            .recipe-content-grid {
                grid-template-columns: 1fr;
            }
            .recipe-title {
                font-size: 1.8em;
            }
        }

        .section-header {
            font-family: 'Playfair Display', serif;
            font-size: 1.45em;
            color: var(--primary-pink);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Interactive Ingredients */
        .ingredient-checklist {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .ingredient-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: background 0.15s;
            user-select: none;
        }

        .ingredient-item:hover {
            background: var(--light-pink);
        }

        .ingredient-item input[type="checkbox"] {
            margin-top: 4px;
            cursor: pointer;
            accent-color: var(--primary-pink);
            width: 17px;
            height: 17px;
        }

        .ingredient-item.checked span {
            text-decoration: line-through;
            opacity: 0.55;
        }

        /* Interactive Instructions */
        .instruction-steps {
            list-style: none;
            padding: 0;
            margin: 0;
            counter-reset: step-counter;
        }

        .instruction-step {
            display: flex;
            gap: 14px;
            margin-bottom: 16px;
            padding: 14px;
            border-radius: 12px;
            background: rgba(0,0,0,0.02);
            border: 1px solid var(--border-color);
            transition: all 0.2s;
            cursor: pointer;
        }

        body.dark-mode .instruction-step {
            background: rgba(255,255,255,0.03);
        }

        .instruction-step:hover {
            border-color: var(--primary-pink);
        }

        .instruction-step.done {
            opacity: 0.55;
            background: rgba(0,0,0,0.05);
        }

        .instruction-step.done .step-text {
            text-decoration: line-through;
        }

        .step-number {
            background: var(--primary-pink);
            color: white;
            font-weight: bold;
            font-size: 0.9em;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .instruction-step.done .step-number {
            background: #27ae60;
        }

        .step-text {
            flex: 1;
            line-height: 1.6;
        }

        /* Fullscreen Cook Mode Overlay */
        .cook-mode-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--background-color);
            color: var(--text-color);
            z-index: 10000;
            flex-direction: column;
            padding: 30px;
            box-sizing: border-box;
        }

        .cook-mode-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .cook-mode-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .cook-step-badge {
            background: var(--primary-pink);
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            padding: 6px 18px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .cook-step-text {
            font-size: 1.8em;
            line-height: 1.5;
            font-weight: 600;
            font-family: 'Open Sans', serif;
            margin-bottom: 30px;
        }

        .cook-mode-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn-cook-nav {
            background: var(--primary-pink);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cook-nav:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-exit-cook {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Toast notifications */
        .toast {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #2ecc71;
            color: white;
            padding: 12px 24px;
            border-radius: 24px;
            font-weight: bold;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            z-index: 10001;
            display: none;
            animation: toastPop 0.2s ease-out;
        }

        @keyframes toastPop {
            from { transform: translateY(15px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            font-size: 0.85em;
            opacity: 0.75;
        }
    </style>
</head>
<body>
    <header>
        <div class="theme-switch-wrapper">
            <label class="theme-switch" for="checkbox">
                <input type="checkbox" id="checkbox" />
                <div class="slider round"></div>
            </label>
        </div>
        <h1>Virtual Recipe Box</h1>
        <div class="header-nav-links">
            <a href="index.html">&larr; Back to Recipe Box</a>
            <a href="feed.html">Community Feed</a>
        </div>
    </header>

    <main>
        <div id="recipeContainer" class="recipe-share-card">
            <p style="text-align:center; padding: 40px;">Loading shared recipe...</p>
        </div>
    </main>

    <!-- Cook Mode Screen -->
    <div id="cookModeOverlay" class="cook-mode-overlay">
        <div class="cook-mode-header">
            <h2 id="cookModeTitle" style="margin:0; font-size:1.3em;">Recipe Cook Mode</h2>
            <button class="btn-exit-cook" onclick="exitCookMode()">&times; Exit Cook Mode</button>
        </div>
        <div class="cook-mode-body">
            <div class="cook-step-badge" id="cookStepBadge">Step 1 of 5</div>
            <div class="cook-step-text" id="cookStepText">Step description goes here...</div>
            <div class="cook-mode-controls">
                <button class="btn-cook-nav" id="btnPrevCookStep" onclick="prevCookStep()">&larr; Previous</button>
                <button class="btn-cook-nav" id="btnNextCookStep" onclick="nextCookStep()">Next Step &rarr;</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Link copied to clipboard!</div>

    <footer>
        &copy; Virtual Recipe Box &bull; Shared Recipe Viewer
    </footer>

    <script>
        let currentRecipe = null;
        let currentShareToken = null;
        let cookStepIndex = 0;
        let instructionSteps = [];
        let wakeLockSentinel = null;

        const urlParams = new URLSearchParams(window.location.search);
        currentShareToken = urlParams.get('token');

        window.Auth.init().then(() => {
            if (!currentShareToken) {
                document.getElementById('recipeContainer').innerHTML = `
                    <div style="text-align:center; padding: 40px;">
                        <h2 style="color:#e74c3c;">⚠️ Missing Share Token</h2>
                        <p>Please open a valid recipe share link.</p>
                        <a href="index.html" class="btn-action btn-clone" style="margin-top:15px;">Return Home</a>
                    </div>
                `;
                return;
            }
            loadSharedRecipe(currentShareToken);
        });

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        async function loadSharedRecipe(token) {
            const container = document.getElementById('recipeContainer');
            try {
                const res = await fetch(`/api/public/recipes/${token}`);
                if (!res.ok) throw new Error('Recipe not found or link has expired');
                currentRecipe = await res.json();
                renderRecipe(currentRecipe);
            } catch (err) {
                container.innerHTML = `
                    <div style="text-align:center; padding: 40px;">
                        <h2 style="color:#e74c3c;">🍽️ Recipe Not Found</h2>
                        <p>${err.message}</p>
                        <a href="index.html" class="btn-action btn-clone" style="margin-top:15px;">Return Home</a>
                    </div>
                `;
            }
        }

        function renderRecipe(recipe) {
            const container = document.getElementById('recipeContainer');
            document.title = `${recipe.title} \u2022 Virtual Recipe Box`;

            const authorName = recipe.author ? (recipe.author.display_name || recipe.author.username) : 'A Fellow Cook';

            const ingredients = recipe.ingredients.split('\n').filter(l => l.trim().length > 0);
            instructionSteps = recipe.instructions.split('\n').filter(l => l.trim().length > 0);

            container.innerHTML = `
                <div class="recipe-hero">
                    <div class="recipe-badges">
                        <span class="badge-category">${escapeHtml(recipe.category || 'General')}</span>
                        <span class="badge-author">Shared by <strong>${escapeHtml(authorName)}</strong></span>
                    </div>
                    <h1 class="recipe-title">${escapeHtml(recipe.title)}</h1>
                    
                    <div class="recipe-meta-grid">
                        <div class="meta-item">
                            <span class="meta-label">⏱️ Prep Time</span>
                            <span class="meta-val">${escapeHtml(recipe.prep_time || '—')}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">🔥 Cook Time</span>
                            <span class="meta-val">${escapeHtml(recipe.cook_time || '—')}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">🍽️ Servings</span>
                            <span class="meta-val">${escapeHtml(recipe.servings || '—')}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">⭐ Difficulty</span>
                            <span class="meta-val">${escapeHtml(recipe.difficulty || 'Easy')}</span>
                        </div>
                    </div>

                    <div class="action-toolbar">
                        <button class="btn-action btn-clone" id="btnCloneShared" onclick="cloneThisRecipe()">
                            📥 Save to My Recipe Box
                        </button>
                        <button class="btn-action btn-cook-mode" onclick="startCookMode()">
                            ✨ Cook Mode
                        </button>
                        <button class="btn-action btn-copy-link" onclick="copyShareLink()">
                            📋 Copy Share Link
                        </button>
                    </div>
                </div>

                <div class="recipe-content-grid">
                    <div>
                        <h3 class="section-header">🥕 Ingredients</h3>
                        <p style="font-size:0.85em; opacity:0.65; margin-top:-8px; margin-bottom:12px;">Click to check off ingredients as you prep:</p>
                        <ul class="ingredient-checklist">
                            ${ingredients.map(ing => `
                                <li class="ingredient-item" onclick="toggleIngredient(this)">
                                    <input type="checkbox" onclick="event.stopPropagation(); toggleIngredient(this.parentElement);" />
                                    <span>${escapeHtml(ing)}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>

                    <div>
                        <h3 class="section-header">🍳 Instructions</h3>
                        <p style="font-size:0.85em; opacity:0.65; margin-top:-8px; margin-bottom:12px;">Click steps to mark as complete:</p>
                        <ul class="instruction-steps">
                            ${instructionSteps.map((step, idx) => `
                                <li class="instruction-step" onclick="toggleStep(this)">
                                    <div class="step-number">${idx + 1}</div>
                                    <div class="step-text">${escapeHtml(step)}</div>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                </div>
            `;
        }

        function toggleIngredient(el) {
            const cb = el.querySelector('input[type="checkbox"]');
            if (el.classList.contains('checked')) {
                el.classList.remove('checked');
                cb.checked = false;
            } else {
                el.classList.add('checked');
                cb.checked = true;
            }
        }

        function toggleStep(el) {
            el.classList.toggle('done');
        }

        async function cloneThisRecipe() {
            const btn = document.getElementById('btnCloneShared');
            if (!window.Auth.isLoggedIn()) {
                window.location.href = `login.html?redirect=${encodeURIComponent(window.location.href)}`;
                return;
            }

            const origText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '⏳ Saving...';

            try {
                const res = await fetch(`/api/recipes/clone/${currentShareToken}`, {
                    method: 'POST',
                    credentials: 'include'
                });
                const data = await res.json();
                if (res.ok) {
                    btn.innerHTML = '✅ Saved in Your Box!';
                    btn.classList.add('saved');
                    showToast('Recipe cloned to your Recipe Box!');
                } else {
                    btn.innerHTML = origText;
                    btn.disabled = false;
                    alert(data.error || 'Failed to save recipe');
                }
            } catch (err) {
                btn.innerHTML = origText;
                btn.disabled = false;
                alert('Error saving recipe: ' + err.message);
            }
        }

        function copyShareLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                showToast('📋 Link copied to clipboard!');
            }).catch(() => {
                prompt('Copy this share link:', window.location.href);
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2500);
        }

        // Cook Mode with Screen WakeLock API
        async function startCookMode() {
            if (!instructionSteps || instructionSteps.length === 0) return;
            cookStepIndex = 0;
            document.getElementById('cookModeTitle').textContent = `Cooking: ${currentRecipe ? currentRecipe.title : ''}`;
            updateCookStepView();
            document.getElementById('cookModeOverlay').style.display = 'flex';

            // Request WakeLock to keep screen on while cooking
            try {
                if ('wakeLock' in navigator) {
                    wakeLockSentinel = await navigator.wakeLock.request('screen');
                }
            } catch (e) {
                console.warn('WakeLock not available:', e);
            }
        }

        function updateCookStepView() {
            const badge = document.getElementById('cookStepBadge');
            const text = document.getElementById('cookStepText');
            const prevBtn = document.getElementById('btnPrevCookStep');
            const nextBtn = document.getElementById('btnNextCookStep');

            badge.textContent = `Step ${cookStepIndex + 1} of ${instructionSteps.length}`;
            text.textContent = instructionSteps[cookStepIndex];

            prevBtn.disabled = (cookStepIndex === 0);
            if (cookStepIndex === instructionSteps.length - 1) {
                nextBtn.textContent = '🎉 Finish Cooking!';
            } else {
                nextBtn.textContent = 'Next Step \u2192';
            }
        }

        function prevCookStep() {
            if (cookStepIndex > 0) {
                cookStepIndex--;
                updateCookStepView();
            }
        }

        function nextCookStep() {
            if (cookStepIndex < instructionSteps.length - 1) {
                cookStepIndex++;
                updateCookStepView();
            } else {
                showToast('👨‍🍳 Bon Appétit! Dish complete!');
                exitCookMode();
            }
        }

        function exitCookMode() {
            document.getElementById('cookModeOverlay').style.display = 'none';
            if (wakeLockSentinel) {
                wakeLockSentinel.release().catch(() => {});
                wakeLockSentinel = null;
            }
        }
    </script>
</body>
</html>
